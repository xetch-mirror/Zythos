# =====================================================================
# Limine Configuration File for Zythos OS
# =====================================================================

# Timeout in seconds before automatically booting the default entry
timeout: 5

# ---------------------------------------------------------------------
# Default Boot Entry
# ---------------------------------------------------------------------
/Zythos OS
    protocol: limine

    # Path to your Zythos kernel binary
    kernel_path: boot():/boot/kernel.elf

    # Initrd module definition
    module_path: boot():/boot/initrd.tar.gz

    # Updated command line argument targeting /usr/sbin/init
    kernel_cmdline: init=/usr/sbin/init quiet

# ---------------------------------------------------------------------
# Debug / Safe Mode Entry
# ---------------------------------------------------------------------
/Zythos OS (Verbose Debug)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    module_path: boot():/boot/initrd.tar.gz
    kernel_cmdline: init=/usr/sbin/init debug=1 verbose
